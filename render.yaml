services:
  - type: web
    name: complyai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://technirbhay.github.io
      - key: GROQ_API_KEY
        sync: false